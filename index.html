<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1e8" id="themeColor" />
  <meta name="description" content="Punktezähler für den Kegelmodus Achtung 5." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Achtung 5" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>Achtung 5 — Kegelzähler</title>
  <style>
    :root {
      color-scheme:light;
      --bg:#f4f1e8;
      --panel:#fffdf7;
      --panel-2:#ebe7db;
      --ink:#18211d;
      --muted:#6e7772;
      --line:#d7d2c5;
      --accent:#df4935;
      --accent-ink:#fff;
      --active:#1f4a3c;
      --active-ink:#fff;
      --special:#1f4a3c;
      --team-a:#df4935;
      --team-a-bg:#f9e5df;
      --team-b:#2b765e;
      --team-b-bg:#e1eee8;
      --shadow:0 20px 55px rgba(29,38,34,.1);
    }
    html[data-theme="dark"] {
      color-scheme:dark;
      --bg:#101512;
      --panel:#18201c;
      --panel-2:#212b26;
      --ink:#f2f1e9;
      --muted:#9aa59f;
      --line:#344139;
      --accent:#f05a44;
      --accent-ink:#fff;
      --active:#d7b950;
      --active-ink:#151a17;
      --special:#315e4f;
      --team-a:#f05a44;
      --team-a-bg:#38231f;
      --team-b:#57aa89;
      --team-b-bg:#1d332b;
      --shadow:0 22px 65px rgba(0,0,0,.3);
    }
    * { box-sizing:border-box; }
    html { touch-action:manipulation; -webkit-text-size-adjust:100%; }
    html, body { margin:0; min-height:100%; }
    body {
      min-height:100vh;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background:var(--bg);
      color:var(--ink);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      transition:background .2s,color .2s;
    }
    button,input { font:inherit; }
    button, .team { touch-action:manipulation; }
    button { -webkit-tap-highlight-color:transparent; }
    .app { width:min(900px,calc(100% - 28px)); margin:auto; padding:22px 0 38px; }
    header { min-height:48px; display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    h1 { margin:0; font-size:20px; letter-spacing:-.025em; }
    h1 span { color:var(--accent); }
    .header-actions { display:flex; gap:8px; }
    .icon-button {
      width:42px; height:42px; display:grid; place-items:center; border:1px solid var(--line); border-radius:50%;
      color:var(--ink); background:var(--panel); cursor:pointer;
    }
    .icon-button:hover { background:var(--panel-2); }
    .icon-button svg { width:18px; height:18px; }
    .sun { display:none; }
    [data-theme="dark"] .sun { display:block; }
    [data-theme="dark"] .moon { display:none; }

    .counter { overflow:hidden; border:1px solid var(--line); border-radius:22px; background:var(--panel); box-shadow:var(--shadow); }
    .scores { padding:clamp(20px,5vw,42px); border-bottom:1px solid var(--line); }
    .turn { margin:0 0 19px; text-align:center; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .turn strong { color:var(--ink); }
    .teams { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .team {
      position:relative; min-width:0; padding:18px 10px 20px; border:1px solid var(--line); border-radius:16px;
      background:var(--panel-2); text-align:center; cursor:pointer; transition:border-color .15s,transform .15s,background .15s;
    }
    .team:hover { transform:translateY(-2px); }
    .team.active { border-color:var(--active); box-shadow:inset 0 0 0 1px var(--active); }
    .team.active::before {
      content:"AM ZUG"; position:absolute; top:-9px; left:50%; transform:translateX(-50%); padding:4px 9px;
      border-radius:999px; color:var(--active-ink); background:var(--active); font-size:8px; font-weight:900; letter-spacing:.1em; white-space:nowrap;
    }
    .team input {
      width:100%; padding:5px 23px 5px 8px; border:0; border-bottom:1px dashed var(--muted); outline:0;
      color:var(--muted); background:transparent; text-align:center; font-size:13px; font-weight:750; cursor:text;
    }
    .team input:hover, .team input:focus { color:var(--ink); border-color:var(--active); }
    .edit-name { position:absolute; top:22px; right:14px; color:var(--muted); font-size:12px; pointer-events:none; }
    .score { display:block; margin-top:10px; font:800 clamp(72px,16vw,138px)/.9 "Arial Narrow",Impact,sans-serif; letter-spacing:-.04em; }
    .team.active .score { color:var(--active); }
    .switch {
      display:flex; align-items:center; gap:7px; margin:18px auto 0; padding:8px 12px; border:0;
      color:var(--muted); background:transparent; cursor:pointer; font-size:11px; font-weight:750;
    }
    .switch:hover { color:var(--ink); }
    .switch svg { width:15px; }

    .throws { padding:clamp(20px,5vw,38px); }
    .throws-head { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:18px; }
    h2 { margin:0; font-size:clamp(18px,3vw,24px); letter-spacing:-.025em; }
    .count { color:var(--muted); font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; white-space:nowrap; }
    .count b { color:var(--ink); font-size:16px; }
    .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:9px; }
    .throw {
      position:relative; min-height:clamp(74px,12vw,103px); border:1px solid var(--line); border-radius:13px;
      color:var(--ink); background:var(--panel-2); cursor:pointer; font-size:clamp(28px,5vw,43px); font-weight:850;
      transition:transform .1s,filter .1s;
    }
    .throw:hover { transform:translateY(-2px); filter:brightness(.97); }
    [data-theme="dark"] .throw:hover { filter:brightness(1.1); }
    .throw:active { transform:scale(.97); }
    .throw:disabled { opacity:.35; cursor:not-allowed; transform:none; filter:none; }
    .throw.two { color:var(--accent-ink); background:var(--accent); border-color:var(--accent); }
    .throw.five { color:#fff; background:var(--special); border-color:var(--special); }
    .throw small { position:absolute; left:3px; right:3px; bottom:7px; font-size:8px; line-height:1; font-weight:900; letter-spacing:.04em; text-transform:uppercase; opacity:.88; }
    .bottom { min-height:44px; display:flex; align-items:end; justify-content:space-between; gap:10px; margin-top:14px; }
    .auto { color:var(--muted); font-size:10px; }
    .undo {
      display:flex; align-items:center; gap:6px; padding:9px; border:0; color:var(--accent); background:transparent;
      cursor:pointer; font-size:11px; font-weight:850;
    }
    .undo:disabled { opacity:.3; cursor:not-allowed; }
    .undo svg { width:15px; }
    dialog {
      width:min(440px,calc(100% - 24px)); max-height:min(620px,calc(100vh - 30px)); padding:0; overflow:hidden;
      border:1px solid var(--line); border-radius:18px; color:var(--ink); background:var(--panel); box-shadow:0 25px 80px #0007;
    }
    dialog::backdrop { background:#080d0bb5; backdrop-filter:blur(3px); }
    .modal-head { display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line); }
    .modal-head h2 { font-size:18px; }
    .close { width:34px; height:34px; border:0; border-radius:50%; color:var(--muted); background:var(--panel-2); cursor:pointer; font-size:21px; line-height:1; }
    .modal-body { padding:20px; overflow:auto; max-height:520px; }
    .history-list { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
    .history-empty { padding:28px 0; color:var(--muted); text-align:center; font-size:12px; }
    .history-legend { display:flex; gap:15px; margin:0 0 13px; color:var(--muted); font-size:10px; font-weight:750; }
    .history-legend span { display:flex; align-items:center; gap:6px; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .history-legend i { width:8px; height:8px; flex:0 0 auto; border-radius:50%; }
    .history-legend .a i { background:var(--team-a); }
    .history-legend .b i { background:var(--team-b); }
    .history-item { display:flex; align-items:center; gap:11px; padding:11px; border:1px solid transparent; border-radius:11px; }
    .history-item.team-0 { border-color:var(--team-a); background:var(--team-a-bg); }
    .history-item.team-1 { border-color:var(--team-b); background:var(--team-b-bg); }
    .history-pin { width:36px; height:36px; flex:0 0 auto; display:grid; place-items:center; border-radius:9px; color:#fff; font-weight:900; }
    .team-0 .history-pin { background:var(--team-a); }
    .team-1 .history-pin { background:var(--team-b); }
    .history-copy { min-width:0; flex:1; }
    .history-copy b { display:block; overflow:hidden; color:var(--ink); font-size:12px; white-space:nowrap; text-overflow:ellipsis; }
    .history-copy small { color:var(--muted); font-size:10px; }
    .history-points { color:var(--active); font-size:13px; font-weight:900; }
    .qr-body { text-align:center; }
    .qr-body p { margin:0 0 17px; color:var(--muted); font-size:12px; line-height:1.5; }
    .qr-wrap { width:220px; height:220px; margin:auto; padding:10px; border-radius:13px; background:#fff; }
    .qr-wrap img { display:block; width:100%; height:100%; }
    .copy-link { width:220px; margin-top:14px; padding:11px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:var(--panel-2); cursor:pointer; font-size:11px; font-weight:850; }
    .winner-body { padding:32px 24px 25px; text-align:center; }
    .trophy { width:66px; height:66px; display:grid; place-items:center; margin:0 auto 17px; border-radius:50%; color:var(--active-ink); background:var(--active); }
    .trophy svg { width:32px; }
    .winner-body h2 { font-size:27px; }
    .winner-body p { margin:8px 0 0; color:var(--muted); font-size:13px; }
    .winner-actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:25px; }
    .winner-actions button { padding:12px 10px; border-radius:10px; cursor:pointer; font-size:11px; font-weight:850; }
    .winner-undo { border:1px solid var(--line); color:var(--ink); background:var(--panel-2); }
    .new-game { border:1px solid var(--active); color:var(--active-ink); background:var(--active); }
    .toast {
      position:fixed; z-index:20; left:50%; bottom:max(20px,env(safe-area-inset-bottom)); transform:translate(-50%,15px);
      padding:10px 15px; border-radius:999px; color:var(--panel); background:var(--ink); box-shadow:0 10px 30px #0004;
      opacity:0; pointer-events:none; transition:.2s; white-space:nowrap; font-size:11px; font-weight:800;
    }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media (max-width:520px) {
      .app { width:calc(100% - 16px); padding-top:12px; }
      header { margin:0 7px 12px; }
      .header-actions { gap:5px; }
      .icon-button { width:39px; height:39px; }
      .counter { border-radius:17px; }
      .scores { padding:24px 10px 20px; }
      .teams { gap:7px; }
      .team { padding:17px 5px 16px; border-radius:13px; }
      .team input { font-size:16px; }
      .score { font-size:clamp(68px,25vw,106px); }
      .throws { padding:22px 10px 20px; }
      .grid { gap:6px; }
      .throw { min-height:73px; border-radius:10px; font-size:30px; }
      .throw small { font-size:7px; letter-spacing:0; }
      .auto { display:none; }
      .bottom { justify-content:flex-end; }
    }
    @media (prefers-reduced-motion:reduce) { * { transition:none!important; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Achtung <span>5</span></h1>
      <div class="header-actions">
        <button class="icon-button" id="historyButton" type="button" aria-label="Wurfverlauf öffnen" title="Verlauf">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
        </button>
        <button class="icon-button" id="qrButton" type="button" aria-label="QR-Code öffnen" title="QR-Code">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v4h-2zM14 18h4v2h-4z"/></svg>
        </button>
        <button class="icon-button" id="themeButton" type="button" aria-label="Darstellung wechseln" title="Hell/Dunkel">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 15.5A9 9 0 0 1 8.5 3.6 9 9 0 1 0 20.5 15.5Z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-button" id="reset" type="button" aria-label="Spiel zurücksetzen" title="Zurücksetzen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </header>

    <section class="counter" aria-label="Punktezähler">
      <div class="scores">
        <p class="turn" id="turnText"><strong>Team Rot</strong> ist am Zug</p>
        <div class="teams">
          <article class="team active" id="team0" data-team="0" tabindex="0">
            <input id="name0" value="Team Rot" maxlength="22" aria-label="Name von Team 1" title="Teamnamen ändern" />
            <span class="edit-name" aria-hidden="true">✎</span>
            <strong class="score" id="score0">0</strong>
          </article>
          <article class="team" id="team1" data-team="1" tabindex="0">
            <input id="name1" value="Team Grün" maxlength="22" aria-label="Name von Team 2" title="Teamnamen ändern" />
            <span class="edit-name" aria-hidden="true">✎</span>
            <strong class="score" id="score1">0</strong>
          </article>
        </div>
        <button class="switch" id="switch" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m17 3 4 4-4 4M3 7h18M7 21l-4-4 4-4M21 17H3"/></svg>
          Team wechseln
        </button>
      </div>

      <div class="throws">
        <div class="throws-head"><h2>Gefallene Kegel</h2><span class="count">Ziel <b>100</b> · Würfe <b id="throwCounts">0:0</b></span></div>
        <div class="grid">
          <button class="throw" data-pins="0" type="button">0</button>
          <button class="throw" data-pins="1" type="button">1</button>
          <button class="throw two" data-pins="2" type="button">2<small>+10</small></button>
          <button class="throw" data-pins="3" type="button">3</button>
          <button class="throw" data-pins="4" type="button">4</button>
          <button class="throw five" data-pins="5" type="button">5<small>für Gegner</small></button>
          <button class="throw" data-pins="6" type="button">6</button>
          <button class="throw" data-pins="7" type="button">7</button>
          <button class="throw" data-pins="8" type="button">8</button>
          <button class="throw" data-pins="9" type="button">9</button>
        </div>
        <div class="bottom">
          <span class="auto">Das Team wechselt nach jedem Wurf automatisch.</span>
          <button class="undo" id="undo" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v1"/></svg>
            Rückgängig
          </button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="historyDialog">
    <div class="modal-head"><h2>Wurfverlauf</h2><button class="close" data-close="historyDialog" type="button" aria-label="Schließen">×</button></div>
    <div class="modal-body">
      <div class="history-legend"><span class="a"><i></i><b id="legend0">Team Rot</b></span><span class="b"><i></i><b id="legend1">Team Grün</b></span></div>
      <ol class="history-list" id="historyList"></ol>
    </div>
  </dialog>

  <dialog id="qrDialog">
    <div class="modal-head"><h2>QR-Code</h2><button class="close" data-close="qrDialog" type="button" aria-label="Schließen">×</button></div>
    <div class="modal-body qr-body">
      <p>Scannen und den Zähler auf einem anderen Handy öffnen.</p>
      <div class="qr-wrap"><img id="qrCode" width="200" height="200" alt="QR-Code zu dieser Website" /></div>
      <button class="copy-link" id="copyLink" type="button">Link kopieren</button>
    </div>
  </dialog>

  <dialog id="winnerDialog">
    <div class="modal-body winner-body">
      <span class="trophy" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 21h8M9 17h6"/></svg></span>
      <h2 id="winnerTitle">Gewonnen!</h2>
      <p id="winnerScore"></p>
      <div class="winner-actions"><button class="winner-undo" id="winnerUndo" type="button">Wurf korrigieren</button><button class="new-game" id="newGame" type="button">Neues Spiel</button></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const initial = { names:['Team Rot','Team Grün'], scores:[0,0], active:0, history:[] };
      let state = load();
      let toastTimer;
      const cards = [$('team0'),$('team1')];
      const names = [$('name0'),$('name1')];
      const scores = [$('score0'),$('score1')];

      function load() {
        try {
          const value = JSON.parse(localStorage.getItem('achtung5-state'));
          if (value && Array.isArray(value.names) && Array.isArray(value.scores) && Array.isArray(value.history)) return value;
        } catch (_) {}
        return structuredClone(initial);
      }
      function save() { try { localStorage.setItem('achtung5-state',JSON.stringify(state)); } catch (_) {} }
      function name(i) { return (state.names[i] || `Team ${i+1}`).trim() || `Team ${i+1}`; }
      function throwCounts() {
        return state.history.reduce((counts,entry)=>{ counts[entry.thrower]=(counts[entry.thrower]||0)+1; return counts; },[0,0]);
      }
      function getWinner() {
        const counts=throwCounts();
        if (counts[0]!==counts[1] || (state.scores[0]<100 && state.scores[1]<100) || state.scores[0]===state.scores[1]) return null;
        return state.scores[0]>state.scores[1] ? 0 : 1;
      }
      function render() {
        const winner=getWinner();
        const counts=throwCounts();
        names.forEach((el,i) => { if (document.activeElement !== el) el.value=state.names[i]; });
        scores.forEach((el,i) => el.textContent=state.scores[i]);
        cards.forEach((el,i) => el.classList.toggle('active',winner===null && state.active===i));
        $('turnText').innerHTML=winner===null ? `<strong>${escapeHtml(name(state.active))}</strong> ist am Zug` : `<strong>${escapeHtml(name(winner))}</strong> gewinnt`;
        $('throwCounts').textContent=`${counts[0]}:${counts[1]}`;
        $('undo').disabled=!state.history.length;
        document.querySelectorAll('[data-pins]').forEach(button=>button.disabled=winner!==null);
        $('switch').disabled=winner!==null;
        if ($('historyDialog').open) renderHistory();
      }
      function escapeHtml(text) { const el=document.createElement('span'); el.textContent=text; return el.innerHTML; }
      function renderHistory() {
        $('legend0').textContent=name(0); $('legend1').textContent=name(1);
        if (!state.history.length) {
          $('historyList').innerHTML='<li class="history-empty">Noch keine Würfe.</li>';
          return;
        }
        $('historyList').innerHTML=state.history.slice().reverse().map((entry,index)=>{
          const thrower=escapeHtml(entry.throwerName || name(entry.thrower));
          const receiver=escapeHtml(entry.receiverName || name(entry.receiver));
          const detail=entry.pins===5 ? `${thrower} warf 5 · für ${receiver}` : `${thrower} warf ${entry.pins}`;
          return `<li class="history-item team-${entry.receiver}"><span class="history-pin">${entry.pins}</span><span class="history-copy"><b>${receiver}</b><small>${detail}</small></span><span class="history-points">+${entry.points}</span></li>`;
        }).join('');
      }
      function throwPins(pins) {
        if (getWinner()!==null) return;
        const thrower=state.active;
        const receiver=pins===5 ? 1-thrower : thrower;
        const points=pins===2 ? 10 : pins;
        state.scores[receiver]+=points;
        state.history.push({pins,points,thrower,receiver,throwerName:name(thrower),receiverName:name(receiver)});
        state.active=1-thrower;
        save(); render();
        const winner=getWinner();
        if (winner!==null) showWinner(winner);
        else if (pins===2) toast(`+10 für ${name(receiver)}`);
        else if (pins===5) toast(`+5 für ${name(receiver)}`);
      }
      function undo() {
        const last=state.history.pop();
        if (!last) return;
        if ($('winnerDialog').open) $('winnerDialog').close();
        state.scores[last.receiver]=Math.max(0,state.scores[last.receiver]-last.points);
        state.active=last.thrower;
        save(); render(); toast('Wurf zurückgenommen');
      }
      function setActive(i) { if (getWinner()===null) { state.active=i; save(); render(); } }
      function showWinner(winner) {
        $('winnerTitle').textContent=`${name(winner)} gewinnt!`;
        $('winnerScore').textContent=`${state.scores[0]} : ${state.scores[1]} · beide Teams hatten gleich viele Würfe`;
        if (!$('winnerDialog').open) $('winnerDialog').showModal();
      }
      function resetGame() {
        state.scores=[0,0]; state.history=[]; state.active=0; save(); render();
        if ($('winnerDialog').open) $('winnerDialog').close();
        toast('Neues Spiel gestartet');
      }
      function toast(text) {
        $('toast').textContent=text; $('toast').classList.add('show');
        clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800);
      }
      function setTheme(theme) {
        document.documentElement.dataset.theme=theme;
        $('themeColor').content=theme==='dark'?'#101512':'#f4f1e8';
        try { localStorage.setItem('achtung5-theme',theme); } catch (_) {}
      }

      document.querySelectorAll('[data-pins]').forEach(button=>button.addEventListener('click',()=>throwPins(Number(button.dataset.pins))));
      cards.forEach((card,i)=>{
        card.addEventListener('click',e=>{ if (e.target.tagName!=='INPUT') setActive(i); });
        card.addEventListener('keydown',e=>{ if ((e.key==='Enter'||e.key===' ')&&e.target===card) { e.preventDefault(); setActive(i); } });
      });
      names.forEach((input,i)=>{
        input.addEventListener('input',()=>{ state.names[i]=input.value; save(); render(); });
        input.addEventListener('blur',()=>{ state.names[i]=name(i); save(); render(); });
        input.addEventListener('keydown',e=>{ if(e.key==='Enter') input.blur(); });
      });
      $('switch').addEventListener('click',()=>setActive(1-state.active));
      $('undo').addEventListener('click',undo);
      $('reset').addEventListener('click',()=>{
        if (!state.history.length || confirm('Punkte und Würfe zurücksetzen?')) resetGame();
      });
      $('winnerUndo').addEventListener('click',undo);
      $('newGame').addEventListener('click',resetGame);
      $('winnerDialog').addEventListener('cancel',event=>event.preventDefault());
      $('historyButton').addEventListener('click',()=>{ renderHistory(); $('historyDialog').showModal(); });
      $('qrButton').addEventListener('click',()=>$('qrDialog').showModal());
      $('themeButton').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
      document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>$(button.dataset.close).close()));
      document.querySelectorAll('dialog').forEach(modal=>modal.addEventListener('click',e=>{ if(e.target===modal && modal.id!=='winnerDialog') modal.close(); }));
      $('copyLink').addEventListener('click',async()=>{
        try { await navigator.clipboard.writeText(location.href); }
        catch (_) { const input=document.createElement('input'); input.value=location.href; document.body.appendChild(input); input.select(); document.execCommand('copy'); input.remove(); }
        toast('Link kopiert');
      });
      $('qrCode').src=`https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=6&color=18362d&bgcolor=ffffff&data=${encodeURIComponent(location.href)}`;
      addEventListener('keydown',e=>{
        if (/^[0-9]$/.test(e.key)&&document.activeElement.tagName!=='INPUT') throwPins(Number(e.key));
        if ((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z') { e.preventDefault(); undo(); }
      });

      if ('serviceWorker' in navigator) {
        addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
      }
      let theme;
      try { theme=localStorage.getItem('achtung5-theme'); } catch (_) {}
      setTheme(theme || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
      render();
      const savedWinner=getWinner();
      if (savedWinner!==null) setTimeout(()=>showWinner(savedWinner));
    })();
  </script>
</body>
</html>
